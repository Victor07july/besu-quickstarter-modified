[profile.default]
src = '.'
out = 'out'
libs = ['lib']
test = 'test'
script = 'script'
remappings = [
  '@openzeppelin/=lib/openzeppelin-contracts/',
  'forge-std/=lib/forge-std/src/'
]
optimizer = true
optimizer_runs = 200
# Ignore Certora verification files that have broken imports
ignored_error_codes = ["license", "code-size"]
deny_warnings = false
# Skip problematic files
skip = ["**/certora/**/*"]

[fmt]
line_length = 120
tab_width = 4
